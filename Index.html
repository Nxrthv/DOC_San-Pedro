<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/Imgs/insignia.ico" type="image/x-icon">
    <title>Bienvenid@ a San Pedro</title>
    <style>
        .container {
            max-width: 350px;
            background: #F8F9FD;
            background: linear-gradient(0deg, rgb(255, 255, 255) 0%, rgb(251, 244, 244) 100%);
            border-radius: 40px;
            padding: 25px 35px;
            border: 5px solid rgb(255, 255, 255);
            box-shadow: rgba(215, 200, 133, 0.878) 0px 30px 30px -20px;
            margin-inline: auto;
            margin-top: 4em;
            border: 1px solid rgba(255, 0, 0, 0.144);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .heading {
            text-align: center;
            font-weight: 900;
            font-size: 30px;
            color: #CC4E4E;
        }
        .form {
            margin-top: 20px;
        }
        .form .input {
            width: 85%;
            background: white;
            border: none;
            padding: 15px 20px;
            border-radius: 20px;
            margin-top: 15px;
            box-shadow: #cc4e4e8f 0px 10px 10px -5px;
            border-inline: 2px solid transparent;
        }
        .form .input::-moz-placeholder {
            color: rgb(170, 170, 170);
        }
        .form .input::placeholder {
            color: rgb(170, 170, 170);
        }
        .form .input:focus {
            outline: none;
            border-inline: 2px solid #CC4E4E;
        }
        .form .forgot-password {
            display: block;
            margin-top: 10px;
            margin-left: 10px;
        }
        .form .forgot-password a {
            font-size: 11px;
            color: #CC4E4E;
            text-decoration: none;
        }
        .form .login-button {
            display: block;
            width: 100%;
            font-weight: bold;
            background: linear-gradient(45deg, #CC4E4E 0%, #6d3434 100%);
            color: white;
            padding-block: 15px;
            margin: 20px auto;
            border-radius: 20px;
            box-shadow: #CC4E4E 0px 20px 10px -15px;
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .form .login-button:hover {
            transform: scale(1.03);
            box-shadow: #CC4E4E 0px 23px 10px -20px;
        }
        .form .login-button:active {
            transform: scale(0.95);
            box-shadow: #CC4E4E 0px 15px 10px -10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading">
            <img src="/Imgs/insignia.ico" style="width: 100px; height: 100px;">
            <h4>Bienvenid@ Sanpedrin@</h4>
        </div>
        <form onsubmit="event.preventDefault(); validarYRedirigir()" class="form">
            <label for="dni" style="padding: 1em;">Ingrese DNI del estudiante</label>
            <input required="" style="margin-top: 1em; margin-bottom: 2em;" class="input" type="text" name="dni" id="dni" placeholder="Dni">
            <label for="clave" style="padding: 1em;">Ingrese la clave que le proporciono el docente</label>
            <input required="" class="input" type="password" name="clave" id="clave" placeholder="Clave">
            <button class="login-button" type="submit" value="Sign In">Ingresar</button>
        </form>
    </div>
</body>
<script>
    function validarYRedirigir() {
        const usuarioCorrecto = "admin";
        const contrasenaCorrecta = "12345";

        const alumno1 = "12345678"
        const claveProfesor = "docente1"

        const usuarioIngresado = document.getElementById("dni").value;
        const contrasenaIngresada = document.getElementById("clave").value;

        if (usuarioIngresado === usuarioCorrecto && contrasenaIngresada === contrasenaCorrecta) {
            window.location.href = "/Templates/Admin.html";
        }
        if (usuarioIngresado === alumno1 && contrasenaIngresada === claveProfesor) {
            window.location.href = "/Templates/PortalInfo.html"
        } else {
            window.location.href = "#"
        }
    }
</script>
</html>
